# Coolify uses Nixpacks when Build Pack is not set to Dockerfile.
# Pin Node 20 and raise heap limit — Next.js builds often OOM on small VPS hosts.
[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_OPTIONS = "--max-old-space-size=4096"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
