# Local development stack for Falcon SaaS (stateless backend dependencies)
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university_governance
    ports:
      # 5433 avoids conflict with a local Windows PostgreSQL service on 5432
      - '5433:5432'
    volumes:
      - falcon_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - falcon_redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - falcon_minio_data:/data

  # Optional: scrape NestJS /metrics (run backend on host or add falcon-api service)
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - falcon_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  falcon_pg_data:
  falcon_redis_data:
  falcon_minio_data:
  falcon_grafana_data:
