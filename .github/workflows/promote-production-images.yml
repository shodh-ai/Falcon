name: Promote production images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full tested Git commit SHA to promote
        required: true
        type: string
      deploy:
        description: Trigger configured Coolify deployment webhooks
        required: true
        default: false
        type: boolean
      readiness_evidence:
        description: Minimized operator-observed readiness JSON; no environments, private configs, keys or production data
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: falcon-production-promotion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.sha.outputs.release_sha }}
      backend_image_id: ${{ steps.images.outputs.backend_image_id }}
      frontend_image_id: ${{ steps.images.outputs.frontend_image_id }}
    steps:
      - name: Validate release SHA
        id: sha
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'release_sha must be a full 40-character lowercase Git SHA' >&2
            exit 1
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require separately collected readiness observations
        env:
          FALCON_ROLLOUT_EVIDENCE: ${{ inputs.readiness_evidence }}
        run: |
          test -n "$FALCON_ROLLOUT_EVIDENCE" || {
            echo 'Minimized operator readiness observations are required; none are generated by this workflow.' >&2
            exit 1
          }

      - name: Check out the exact release for access review
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend review tooling
        run: npm ci --ignore-scripts --prefix backend

      - name: Block promotion of unreviewed or changed access surfaces
        working-directory: backend
        run: node scripts/security/access-surface.cjs --enforce

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both immutable images exist
        id: images
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
        run: |
          docker buildx imagetools inspect "ghcr.io/shodh-ai/falcon-backend:sha-$RELEASE_SHA"
          docker buildx imagetools inspect "ghcr.io/shodh-ai/falcon-frontend:sha-$RELEASE_SHA"
          docker pull --platform linux/amd64 "ghcr.io/shodh-ai/falcon-backend:sha-$RELEASE_SHA"
          docker pull --platform linux/amd64 "ghcr.io/shodh-ai/falcon-frontend:sha-$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "ghcr.io/shodh-ai/falcon-backend:sha-$RELEASE_SHA")" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "ghcr.io/shodh-ai/falcon-frontend:sha-$RELEASE_SHA")" = "$RELEASE_SHA"
          printf 'backend_image_id=%s\n' "$(docker image inspect --format '{{.Id}}' "ghcr.io/shodh-ai/falcon-backend:sha-$RELEASE_SHA")" >> "$GITHUB_OUTPUT"
          printf 'frontend_image_id=%s\n' "$(docker image inspect --format '{{.Id}}' "ghcr.io/shodh-ai/falcon-frontend:sha-$RELEASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Require ledger schema restore and runtime preflight evidence
        env:
          FALCON_ROLLOUT_EVIDENCE: ${{ inputs.readiness_evidence }}
          RELEASE_SHA: ${{ steps.sha.outputs.release_sha }}
          BACKEND_IMAGE_ID: ${{ steps.images.outputs.backend_image_id }}
          FRONTEND_IMAGE_ID: ${{ steps.images.outputs.frontend_image_id }}
        run: |
          python3 -B ops/runtime-boundaries/release_readiness.py \
            --release-sha "$RELEASE_SHA" --backend-image "$BACKEND_IMAGE_ID" \
            --frontend-image "$FRONTEND_IMAGE_ID"

  promote:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote backend and frontend without rebuilding
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/shodh-ai/falcon-backend:production \
            "ghcr.io/shodh-ai/falcon-backend:sha-$RELEASE_SHA"
          docker buildx imagetools create \
            --tag ghcr.io/shodh-ai/falcon-frontend:production \
            "ghcr.io/shodh-ai/falcon-frontend:sha-$RELEASE_SHA"

  deploy-backend:
    if: inputs.deploy
    needs: [validate, deploy-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Require fresh runtime and exact running frontend evidence before backend
        env:
          FALCON_ROLLOUT_EVIDENCE: ${{ inputs.readiness_evidence }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          BACKEND_IMAGE_ID: ${{ needs.validate.outputs.backend_image_id }}
          FRONTEND_IMAGE_ID: ${{ needs.validate.outputs.frontend_image_id }}
        run: |
          python3 -B ops/runtime-boundaries/release_readiness.py \
            --release-sha "$RELEASE_SHA" --backend-image "$BACKEND_IMAGE_ID" \
            --frontend-image "$FRONTEND_IMAGE_ID" --require-frontend

      - name: Trigger backend image pull
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_DEPLOY_WEBHOOK }}
        run: |
          test -n "$DEPLOY_WEBHOOK" || {
            echo 'COOLIFY_BACKEND_DEPLOY_WEBHOOK is not configured' >&2
            exit 1
          }
          curl --fail-with-body --retry 3 --retry-all-errors "$DEPLOY_WEBHOOK"

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 \
              https://apifalcon.jataka.io/health >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Backend did not become healthy within five minutes' >&2
          exit 1

  deploy-frontend:
    if: inputs.deploy
    needs: [validate, promote]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Recheck ledger schema restore and runtime observations before frontend
        env:
          FALCON_ROLLOUT_EVIDENCE: ${{ inputs.readiness_evidence }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          BACKEND_IMAGE_ID: ${{ needs.validate.outputs.backend_image_id }}
          FRONTEND_IMAGE_ID: ${{ needs.validate.outputs.frontend_image_id }}
        run: |
          python3 -B ops/runtime-boundaries/release_readiness.py \
            --release-sha "$RELEASE_SHA" --backend-image "$BACKEND_IMAGE_ID" \
            --frontend-image "$FRONTEND_IMAGE_ID"

      - name: Trigger frontend image pull
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK }}
        run: |
          test -n "$DEPLOY_WEBHOOK" || {
            echo 'COOLIFY_FRONTEND_DEPLOY_WEBHOOK is not configured' >&2
            exit 1
          }
          curl --fail-with-body --retry 3 --retry-all-errors "$DEPLOY_WEBHOOK"

      - name: Check frontend reachability; exact revision proof is a separate backend gate
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 \
              https://falcon.jataka.io/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Frontend did not become healthy within five minutes' >&2
          exit 1
