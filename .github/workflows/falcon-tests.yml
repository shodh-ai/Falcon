name: Falcon CI

on:
  push:
    branches: [main, develop, testing]
  pull_request:
    branches: [main, develop, testing]

jobs:
  access-protection:
    name: Access and data preservation safeguards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: test
      PORTAL_EMAIL_DELIVERY_ENABLED: 'false'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: falcon_test_access
      DB_USERNAME: postgres
      DB_PASSWORD: synthetic-test-password
      FALCON_SYNTHETIC_DB: '1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: falcon_test_access
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --prefix backend
      - name: Test access boundaries with synthetic offline data
        working-directory: backend
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/common/websockets/scoped-socket.service.spec.ts \
            src/common/interceptors/impersonation-readonly.interceptor.spec.ts \
            src/modules/academics/course-lms.material-preservation.spec.ts \
            src/modules/academics/course-lms.delete-module.spec.ts \
            src/modules/finance/finance-receipt-preservation.spec.ts \
            src/uploads/uploads.service.spec.ts
          node --test scripts/security/access-surface.spec.cjs
          node --test scripts/security/transaction-scope.spec.cjs
      - name: Inventory all access surfaces without loading the application
        working-directory: backend
        run: node scripts/security/access-surface.cjs --json > access-surface.json
      - uses: actions/upload-artifact@v4
        with:
          name: access-surface-review
          path: backend/access-surface.json

  notification-security:
    name: Notification and sender security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: test
      PORTAL_EMAIL_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the reviewed Linux notification staging artifact.
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --prefix backend

      # These specs mock persistence, queues and SMTP. No application starts.
      - name: Test notification and password-reset sender safeguards offline
        working-directory: backend
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/core/notifications/notification-activation.spec.ts \
            src/core/notifications/notification-cron.service.spec.ts \
            src/core/notifications/notification-delivery.processor.spec.ts \
            src/core/notifications/notification-delivery-policy.spec.ts \
            src/core/notifications/notification-dispatch.service.spec.ts \
            src/core/notifications/notification-email-body.spec.ts \
            src/core/notifications/notification-message.catalog.spec.ts \
            src/core/notifications/notification-outbox.service.spec.ts \
            src/core/notifications/notification-outbox-index.spec.ts \
            src/core/notifications/notification-readiness.spec.ts \
            src/core/notifications/notification-worker-lifecycle.spec.ts \
            src/core/notifications/notification-release.config.spec.ts \
            src/core/notifications/notification-startup.spec.ts \
            src/core/notifications/notifications.gateway.spec.ts \
            src/core/notifications/notifications.service.spec.ts \
            src/core/redis/redis-connection.config.spec.ts \
            src/core/redis/redis.service.spec.ts \
            src/notifications-staging/config.spec.ts \
            src/notifications-staging/capture.spec.ts \
            src/notifications-staging/module.spec.ts \
            src/common/email/falcon-email-sender.spec.ts \
            src/common/email/falcon-email-consumers.spec.ts \
            src/auth/password-reset-sender.spec.ts \
            src/auth/password-reset.security.spec.ts

      - name: Validate notification staging preparation offline
        working-directory: backend
        run: |
          node --test scripts/notifications/staging/preparation.spec.cjs
          node --test scripts/notifications/staging/schema/preparation.spec.cjs
          node --test scripts/healthcheck.spec.cjs
          node --check scripts/notifications/staging/ingress.cjs
          node --check scripts/notifications/staging/review-plan.cjs

      - name: Typecheck backend without emitting files
        working-directory: backend
        run: npx --no-install tsc --noEmit --incremental false -p tsconfig.json

      - name: Build backend without startup or migration hooks
        working-directory: backend
        run: npm run build --ignore-scripts

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: falcon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: falcon_test
      FALCON_TEST_DB: 1
      JWT_SECRET: test-jwt-secret-do-not-use-in-production
      JWT_EXPIRATION: 1d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Copy test environment
        run: cp tests/.env.test.example tests/.env.test

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix tests

      - name: Migrate test database
        working-directory: tests
        run: npm run db:migrate:test

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Typecheck, lint, test, build
        working-directory: tests
        run: npm run test:ci

      - name: Test HR correction email against PostgreSQL and TypeORM
        working-directory: backend
        run: node scripts/test-staff-review-email-driver.cjs

      - name: Upload coverage (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: tests/coverage/unit
          if-no-files-found: ignore

      - name: Upload coverage (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: tests/coverage/integration
          if-no-files-found: ignore

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          if-no-files-found: ignore
