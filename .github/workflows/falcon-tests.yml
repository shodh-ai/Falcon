name: Falcon CI

on:
  push:
    branches: [main, develop, testing]
  pull_request:
    branches: [main, develop, testing]

jobs:
  exam-workflow-integration:
    name: Examination workflow PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: falcon_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: falcon_examcell_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U falcon_test -d falcon_examcell_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      FALCON_TEST_DB: '1'
      TEST_DATABASE_URL: postgresql://falcon_test:disposable_ci_only@127.0.0.1:55432/falcon_examcell_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - name: Prepare only the empty disposable fixture
        working-directory: backend
        env:
          FALCON_EMPTY_TEST_BOOTSTRAP: '1'
        run: |
          node --test scripts/bootstrap-hall-ticket-test-db.spec.js
          node scripts/bootstrap-hall-ticket-test-db.js
      - name: Verify custody, immutable papers and atomic eligibility decisions
        working-directory: backend
        run: >-
          npm test -- --runInBand
          --testPathPatterns='exam-day.postgres.integration|question-paper.postgres.integration|degree-eligibility.postgres.integration|workforce-monthly-limits.postgres'

  deployment-boundaries:
    name: Storage and database deployment boundaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check startup, storage refusal and host preflight decisions
        run: |
          node --test backend/scripts/storage-boundary.spec.cjs backend/scripts/resource-boundary.spec.cjs backend/scripts/runtime-start.spec.cjs backend/scripts/deploy-migrate.spec.cjs
          node --test ops/deployment-safety/tests/recovery_upload_probe.spec.cjs
          python3 -B -m unittest discover -s ops/deployment-safety/tests -v
      - name: Prepare official disposable PostgreSQL 18 fixture image
        run: |
          docker pull postgres:18-alpine
          echo "FALCON_TEST_PG_IMAGE=$(docker image inspect --format '{{.Id}}' postgres:18-alpine)" >> "$GITHUB_ENV"
      - name: Prove runtime grants against isolated PostgreSQL
        env:
          FALCON_RUN_ISOLATED_SQL_TESTS: '1'
          FALCON_TEST_DOCKER_SOCKET: /var/run/docker.sock
        run: python3 -B -m unittest discover -s ops/deployment-safety/tests -p test_runtime_role.py -v

  notification-security:
    name: Notification and sender security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: test
      PORTAL_EMAIL_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the reviewed Linux notification staging artifact.
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --prefix backend

      - name: Test read-only document reconciliation with synthetic data
        run: node --test ops/deployment-safety/tests/document_reconciliation.spec.cjs ops/deployment-safety/tests/document_media_proof.spec.cjs

      # These specs mock persistence, queues and SMTP. No application starts.
      - name: Test notification and password-reset sender safeguards offline
        working-directory: backend
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/core/notifications/notification-activation.spec.ts \
            src/core/notifications/notification-cron.service.spec.ts \
            src/core/notifications/notification-delivery.processor.spec.ts \
            src/core/notifications/notification-delivery-policy.spec.ts \
            src/core/notifications/notification-dispatch.service.spec.ts \
            src/core/notifications/notification-email-body.spec.ts \
            src/core/notifications/notification-message.catalog.spec.ts \
            src/core/notifications/notification-outbox.service.spec.ts \
            src/core/notifications/notification-outbox-index.spec.ts \
            src/core/notifications/notification-readiness.spec.ts \
            src/core/notifications/notification-worker-lifecycle.spec.ts \
            src/core/notifications/notification-release.config.spec.ts \
            src/core/notifications/notification-startup.spec.ts \
            src/core/notifications/notifications.gateway.spec.ts \
            src/core/notifications/notifications.service.spec.ts \
            src/core/redis/redis-connection.config.spec.ts \
            src/core/redis/redis.service.spec.ts \
            src/notifications-staging/config.spec.ts \
            src/notifications-staging/capture.spec.ts \
            src/notifications-staging/module.spec.ts \
            src/common/email/falcon-email-sender.spec.ts \
            src/common/email/falcon-email-consumers.spec.ts \
            src/auth/password-reset-sender.spec.ts \
            src/auth/password-reset.security.spec.ts

      - name: Validate notification staging preparation offline
        working-directory: backend
        run: |
          node --test scripts/notifications/staging/preparation.spec.cjs
          node --test scripts/notifications/staging/schema/preparation.spec.cjs
          node --test scripts/healthcheck.spec.cjs
          node --check scripts/notifications/staging/ingress.cjs
          node --check scripts/notifications/staging/review-plan.cjs

      - name: Verify deployment-owned Faculty AI schema readiness
        working-directory: backend
        run: npm test -- --runInBand --runTestsByPath src/modules/faculty-ai/faculty-ai-schema-readiness.spec.ts

      - name: Typecheck backend without emitting files
        working-directory: backend
        run: npx --no-install tsc --noEmit --incremental false -p tsconfig.json

      - name: Build backend without startup or migration hooks
        working-directory: backend
        run: npm run build --ignore-scripts

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: falcon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: falcon_test
      FALCON_TEST_DB: 1
      JWT_SECRET: test-jwt-secret-do-not-use-in-production
      JWT_EXPIRATION: 1d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Copy test environment
        run: cp tests/.env.test.example tests/.env.test

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix tests

      - name: Migrate test database
        working-directory: tests
        env:
          ALLOW_SCHEMA_BOOTSTRAP_SYNC: 'true'
        run: npm run db:migrate:test

      - name: Student timetable and attendance identity regressions
        working-directory: backend
        env:
          FALCON_RUN_STUDENT_ATTENDANCE_SQL_TESTS: '1'
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/modules/academics/student-dated-timetable.spec.ts \
            src/modules/academics/student-timetable-visibility.spec.ts \
            src/modules/academics/academics.service.spec.ts \
            src/modules/student-portal/student-portal.service.spec.ts \
            src/modules/student-portal/student-portal.security.spec.ts \
            src/modules/academics/student-results.security.spec.ts \
            src/modules/academics/student-enrollment-sync.service.spec.ts
          node --test scripts/student-attendance-session-identity.spec.cjs

      - name: HR QA workflow, scoped queues, reports and document storage regressions
        working-directory: backend
        env:
          # Specs create TEMP tables and roll back; no live HR data is used.
          HR_QA_PG_URL: postgresql://postgres:postgres@localhost:5432/falcon_test
        run: npm test -- --runInBand --testPathPatterns='modules/hr/.*spec.ts'

      - name: HR QA frontend regressions
        working-directory: frontend
        run: >-
          npm test -- src/components/hr/__tests__
          src/components/layout/__tests__/QuickActionMenu.test.tsx
          src/lib/__tests__/notification-display.test.ts
          src/lib/__tests__/notification-display-extended.test.ts
          src/lib/__tests__/quick-action-dates.test.ts
          src/lib/__tests__/quick-action-access.test.ts

      - name: Build backend and verify real document ZIP integrity
        working-directory: backend
        run: |
          npm run build --ignore-scripts
          node scripts/test-hr-document-export.cjs

      - name: Principal oversight transactional workflow integration
        working-directory: backend
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node scripts/principal-oversight.integration.js

      - name: HOD personal timetable and department course isolation
        working-directory: backend
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node scripts/hod-course-scope.integration.cjs

      - name: Principal workspace and approval interface regressions
        working-directory: frontend
        run: npm test -- src/components/principal/__tests__ src/lib/__tests__/principal-routing.test.ts

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Typecheck, lint, test, build
        working-directory: tests
        run: npm run test:ci

      - name: Test HR correction email against PostgreSQL and TypeORM
        working-directory: backend
        run: node scripts/test-staff-review-email-driver.cjs

      - name: Test HR gate pass and profile correction regressions
        working-directory: backend
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/modules/hr/hr-gate-pass-review.spec.ts \
            src/modules/student-onboarding/staff-profile-review.service.spec.ts \
            src/modules/student-onboarding/staff-profile-review-notification.service.spec.ts
          node scripts/test-hr-gate-pass-queues.cjs

      - name: Test HR gate pass page and unchecked-document correction flow
        working-directory: frontend
        run: >-
          npm test -- src/components/hr/__tests__/HrGatePassesPage.test.tsx
          src/components/onboarding/__tests__/StaffProfileVerificationsPage.test.tsx

      - name: Upload coverage (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: tests/coverage/unit
          if-no-files-found: ignore

      - name: Upload coverage (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: tests/coverage/integration
          if-no-files-found: ignore

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          if-no-files-found: ignore
